# version: '3.9'

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab09_app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - app_network
    volumes:
      - ./data:/app/data

networks:
  app_network:
    driver: bridge